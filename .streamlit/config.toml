# Native Streamlit theming for the frontend CRM shell (streamlit_app.py
# + app_pages/*.py). Picked up from the working directory Streamlit is
# run from — that's the repo root both locally (`streamlit run
# streamlit_app.py` from repo root, per README) and in
# Dockerfile (WORKDIR /app, this file copied to /app/.streamlit/).
#
# Brand-accent palette: the conventional enterprise CRM/marketing-platform
# look (Salesforce/HubSpot-style) — a neutral light content area, a trust-
# signaling blue primary accent, and a dark slate sidebar (not a tinted
# brand color) so the module navigation reads as a distinct "app shell"
# rail. Keep this in sync with utils/theme.py's PALETTE, which
# carries the same tokens into custom CSS Streamlit's theme system can't
# reach (success/warning/danger, card/metric/tab styling).
[theme]
base = "dark"
primaryColor = "#ff7a59"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#121c2b"
textColor = "#eaf2ff"
borderColor = "#2a3950"
linkColor = "#9b8cff"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
baseRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0e1728"
secondaryBackgroundColor = "#121c2b"
textColor = "#eaf2ff"
primaryColor = "#ff7a59"
borderColor = "#2a3950"
